<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>คู่มือ eForm ใบเสนอราคา MCS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600&display=swap">
<style>
:root{--bg:#f1f4f8;--paper:#fff;--ink:#1e293b;--muted:#5b6678;--line:#d8dee8;--accent:#1d4ed8;--on-accent:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1520;--paper:#172030;--ink:#e4e9f1;--muted:#9aa6b8;--line:#2b3648;--accent:#8fb3ff;--on-accent:#0f1520;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,"Leelawadee UI",Tahoma,sans-serif;line-height:1.7;padding:24px 16px}
main{max-width:520px;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:32px 28px;display:grid;gap:14px}
.eyebrow{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:0;font-size:1.6rem;line-height:1.3}
p{margin:0;color:var(--muted)}
a.go{justify-self:start;margin-top:6px;background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:600;padding:10px 20px;border-radius:8px}
a.go:hover{filter:brightness(1.08)}
a.go:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
small{color:var(--muted);font-size:.82rem}
</style>
</head>
<body>
<main>
  <div class="eyebrow">TTC Price Master · Focus group MCS</div>
  <h1>คู่มือใช้งาน eForm ใบเสนอราคา</h1>
  <p>คู่มือภาษาไทยพร้อมภาพประกอบ สำหรับ Sales และผู้อนุมัติของ BU MCS</p>
  <a class="go" href="https://claude.ai/artifact/KM2Jpg9d5VVaTKJDoZc8jD">เปิดคู่มือ</a>
  <small>เปิดได้เฉพาะผู้ที่ได้รับสิทธิ์ ถ้าเปิดไม่ได้ ให้ติดต่อผู้ดูแลโครงการ</small>
</main>
</body>
</html>
